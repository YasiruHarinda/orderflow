# LOCAL CLUSTER ONLY. Plain, well-known passwords are fine here because this cluster runs on
# your machine and is thrown away. In AKS these Secrets are created by External Secrets from
# Azure Key Vault, and no password is ever stored in git.
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-dependencies
type: Opaque
stringData:
  postgres-password: local-dev-postgres
  rabbitmq-password: local-dev-rabbitmq
---
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-orders-api
type: Opaque
stringData:
  ConnectionStrings__ordersdb: Host=postgres;Database=ordersdb;Username=orderflow;Password=local-dev-postgres
  ConnectionStrings__rabbitmq: amqp://orderflow:local-dev-rabbitmq@rabbitmq:5672
---
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-inventory-api
type: Opaque
stringData:
  ConnectionStrings__inventorydb: Host=postgres;Database=inventorydb;Username=orderflow;Password=local-dev-postgres
  ConnectionStrings__rabbitmq: amqp://orderflow:local-dev-rabbitmq@rabbitmq:5672
  ConnectionStrings__redis: redis:6379
---
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-notifications-worker
type: Opaque
stringData:
  ConnectionStrings__rabbitmq: amqp://orderflow:local-dev-rabbitmq@rabbitmq:5672
