# The cluster's front door (Gateway API). Envoy Gateway turns this into an Envoy proxy with
# a LoadBalancer Service; k3d maps it to http://localhost:8080. The HTTPRoute from the Helm
# chart attaches to it. (The cluster-wide GatewayClass is in cluster/gatewayclass.yaml.)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: orderflow
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
