{{- /*
Gateway API (the successor of Ingress): sends /api/* from the shared Envoy Gateway
to the OrderFlow gateway service. Nothing else in the cluster is exposed.
*/ -}}
{{- if and .Values.httpRoute.enabled .Values.services.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orderflow
  labels:
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: gateway
          port: 80
{{- end }}
