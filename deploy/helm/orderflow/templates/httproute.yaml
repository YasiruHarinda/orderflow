{{- /*
Gateway API (the successor of Ingress): sends all traffic from the shared Envoy Gateway
to the OrderFlow gateway service, which serves the web store and routes /api/* to the
services. Nothing else in the cluster is exposed.
*/ -}}
{{- if and .Values.httpRoute.enabled .Values.services.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orderflow
  labels:
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
      {{- with .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ . }} # which listener of the shared Gateway (e.g. dev on :8080, prod on :80)
      {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gateway
          port: 80
{{- end }}
