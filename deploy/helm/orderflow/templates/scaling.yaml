{{- /*
HorizontalPodAutoscaler: add pods when CPU is high, remove them when it is low.
PodDisruptionBudget: during node maintenance, keep at least one pod of each service running.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
{{- $autoscaling := dig "autoscaling" "enabled" false $svc }}
{{- if $autoscaling }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    {{- if dig "rollout" "enabled" false $svc }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    {{- else }}
    apiVersion: apps/v1
    kind: Deployment
    {{- end }}
    name: {{ $name }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # wait 5 minutes before removing pods (avoid flapping)
{{- end }}
{{- if or $autoscaling (gt (int $svc.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "orderflow.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
