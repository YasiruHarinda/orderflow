{{- /*
Zero trust inside the cluster: a pod only accepts connections from the pods that need it.
  gateway              <- Envoy proxies only
  orders-api           <- gateway only
  inventory-api        <- gateway only
  notifications-worker <- nobody (it only reads from RabbitMQ)
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
{{- $fromIngress := dig "allowFromIngress" false $svc }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "orderflow.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  {{- if or $svc.allowFrom $fromIngress }}
  ingress:
    - from:
        {{- range $svc.allowFrom }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
        {{- if $fromIngress }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.ingressNamespace }}
        {{- end }}
      ports:
        - port: http
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
