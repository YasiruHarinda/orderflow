# Continuous Delivery: after CI passes on main, build the container images, scan them,
# push them to GitHub Container Registry, sign them, and tell GitOps to deploy them.
#
#   CI green on main
#     -> build image -> Trivy scan (fail on fixable HIGH/CRITICAL) -> push -> SBOM -> sign
#     -> commit new tag to orderflow-gitops (dev)   => ArgoCD deploys to dev automatically
#     -> open a pull request for prod               => a human approves; ArgoCD does a canary
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at once; finish the current one first.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The exact commit that passed CI (not whatever main points to now).
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Image ${{ matrix.service }}
    # Only release commits pushed to main whose CI succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push to ghcr.io
      id-token: write          # keyless signing with Sigstore (OIDC, no private key to manage)
      security-events: write   # show Trivy findings in the repository's Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: orders-api
            dockerfile: src/Orders/Orders.API/Dockerfile
          - service: inventory-api
            dockerfile: src/Inventory/Inventory.API/Dockerfile
          - service: notifications-worker
            dockerfile: src/Notifications/Notifications.Worker/Dockerfile
          - service: gateway
            dockerfile: src/Gateway/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Image name and tag
        run: |
          # Registry names must be lower case; the tag is the short commit SHA, so every
          # image can be traced back to the exact code it was built from.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
          echo "TAG=sha-${COMMIT_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local Docker daemon first, so we can scan BEFORE anything is published.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image (fail on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan image (SARIF report for the Security tab)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}

      # Same build again: every layer comes from the cache, so this only pushes.
      - name: Push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
          cache-from: type=gha,scope=${{ matrix.service }}

      # SBOM = Software Bill of Materials: the list of every package inside the image.
      # When the next big vulnerability is announced, you can check exposure in seconds.
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signing proves the image was built by THIS workflow and has not been changed since.
      # The signature is tied to the image digest (its content hash), not to a tag.
      - name: Sign image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  update-gitops:
    name: Deploy to dev, propose prod
    needs: images
    runs-on: ubuntu-latest
    env:
      # Fine-grained personal access token with "contents" and "pull requests" write
      # access to the orderflow-gitops repository only.
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      SERVICES: orders-api inventory-api notifications-worker gateway
    steps:
      - name: Skip when GitOps is not configured
        if: env.GITOPS_TOKEN == ''
        run: echo "::notice::The GITOPS_TOKEN secret is not set, so no deployment was triggered."

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: env.GITOPS_TOKEN != ''
        with:
          repository: ${{ github.repository_owner }}/orderflow-gitops
          token: ${{ env.GITOPS_TOKEN }}
          path: gitops

      - name: Deploy to dev
        if: env.GITOPS_TOKEN != ''
        working-directory: gitops
        run: |
          TAG="sha-${COMMIT_SHA::7}"
          for svc in $SERVICES; do
            yq -i ".services.\"$svc\".image.tag = \"$TAG\"" envs/dev/values.yaml
          done
          git config user.name "orderflow-release-bot"
          git config user.email "orderflow-release-bot@users.noreply.github.com"
          git commit -am "dev: deploy $TAG" || { echo "dev already runs $TAG"; exit 0; }
          git push

      - name: Open promotion pull request for prod
        if: env.GITOPS_TOKEN != ''
        working-directory: gitops
        env:
          GH_TOKEN: ${{ env.GITOPS_TOKEN }}
        run: |
          TAG="sha-${COMMIT_SHA::7}"
          git switch -c "promote/$TAG"
          for svc in $SERVICES; do
            yq -i ".services.\"$svc\".image.tag = \"$TAG\"" envs/prod/values.yaml
          done
          git commit -am "prod: promote $TAG" || { echo "prod already runs $TAG"; exit 0; }
          git push -u origin "promote/$TAG"
          gh pr create \
            --title "Promote $TAG to prod" \
            --body "Built and scanned from ${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT_SHA}. Merging starts a canary rollout of orders-api in prod."
